/* which mark is in the room: B5 is the chosen identity; B1, B4, B6 are alternatives for comparison */
const LOGO_GROUPS = [
  ['Two strokes · chosen', ['B5']],
  ['The wing', ['W1']],
  ['SW initials', ['B1', 'B4', 'F2', 'K1']],
  ['Number or stripes', ['B6', 'F6']],

const LOGOS = [].concat(...LOGO_GROUPS.map(g => g[1]));
const LOGO_NAMES = SWF.names;
const WEIGHTS = [['light', 'Light'], ['medium', 'Medium'], ['bold', 'Bold'], ['lean', 'Bold, leaning']];
const q0 = new URLSearchParams(location.search);
let LOGO = (q0.get('logo') || 'B5').toUpperCase().replace(/^B5(M|B|BL)$/, 'B5'); if (!LOGOS.includes(LOGO)) LOGO = 'B5';

/* on a sign, the small lines (ATHLETIC CLUB, PERTH · EST.) are made bigger so they can be cut and read from across the room:

function signText(s) {
  // the small lines keep their designed size and position; they get a bolder face and a hair of stroke so they can be cut and read.
  s = s.replace(/font-family="Barlow Semi Condensed, Arial Narrow, sans-serif"/g, 'font-family="SWTag, Arial Narrow, sans-serif"');

/* ---------- geometry helpers ---------- */
function box(w, h, d, mat, x, y, z, ry) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); if (ry) m.rotation.y = ry; scene.add(m); return m; }

const S = 26, OX = 128, OY = 44, H = 3.8;
const mx = px => (px - OX) / S, mz = py => (py - OY) / S, PT = (px, py) => [mx(px), mz(py)];

{

const floor = new THREE.Mesh(new THREE.PlaneGeometry(WX, WZ), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .8 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(WX / 2, 0, WZ / 2); scene.add(floor);

// ceiling: exposed black, with HUB's rounded LED loops and long strips
plane(WX, WZ, M.ceil, WX / 2, H, WZ / 2, Math.PI / 2);
function ledLoop(x0, y0, x1, y1, r, y) {
